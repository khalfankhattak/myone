
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday Fiza</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff6b9d, #9b59b6);
            color: white;
            text-align: center;
        }

        nav {
            background: rgba(0,0,0,0.25);
            padding: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 12px;
            font-weight: bold;
        }

        nav a:hover {
            color: #ffeaa7;
        }

        .container {
            min-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .card {
            max-width: 650px;
            padding: 45px 25px;
            border-radius: 25px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .cake {
            font-size: 90px;
            animation: bounce 2s infinite;
        }

        h1 {
            font-size: 55px;
            margin: 15px 0;
            text-shadow: 0 0 20px white;
        }

        p {
            font-size: 19px;
            line-height: 1.7;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 25px;
            background: white;
            color: #9b59b6;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
        }

        .button:hover {
            transform: scale(1.05);
        }

        @keyframes bounce {
            50% {
                transform: translateY(-20px);
            }
        }

        @media(max-width:600px) {

            h1 {
                font-size: 38px;
            }

            .cake {
                font-size: 65px;
            }

            p {
                font-size: 16px;
            }

            nav a {
                margin: 5px;
                font-size: 14px;
            }
        }
    </style>
</head>
